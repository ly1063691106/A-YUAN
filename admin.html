<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>阿缘摄影 · 后台管理（仅本机使用）</title>
<style>
:root { --bg:#0C0B0A; --panel:#141210; --ink:#EFEBE4; --ink2:#C3BCB1; --muted:#938C83;
  --accent:#C2452E; --border:rgba(239,235,228,.12); --ok:#5FA463; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--ink); font:14px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; padding:20px; }
h1 { font-size:19px; letter-spacing:.08em; margin-bottom:4px; }
h1 small { color:var(--muted); font-size:12px; font-weight:400; margin-left:10px; }
.sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
.panel h2 { font-size:13px; letter-spacing:.14em; color:var(--muted); margin-bottom:10px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.row:last-child { margin-bottom:0; }
label.f { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); }
input, select { background:#0C0B0A; border:1px solid var(--border); border-radius:6px; color:var(--ink); padding:7px 10px; font-size:13px; }
input[type=text], input[type=password] { min-width:0; }
#pat { width:340px; } #owner,#repo,#branch,#path { width:170px; }
button { background:var(--accent); color:#FFF4F0; border:0; border-radius:6px; padding:8px 18px; font-size:13px; cursor:pointer; letter-spacing:.05em; }
button.ghost { background:none; border:1px solid var(--border); color:var(--ink2); }
button:disabled { opacity:.45; cursor:default; }
#status { font-size:12px; color:var(--ink2); }
#status.ok { color:var(--ok); } #status.err { color:var(--accent); }
.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
#q { width:220px; }
.meta { font-size:12px; color:var(--muted); }
#list { display:flex; flex-direction:column; gap:8px; }
.item { display:grid; grid-template-columns:auto 74px 1fr auto; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; align-items:center; }
.item.is-feat { border-color:rgba(194,69,46,.55); }
.item img { width:74px; height:56px; object-fit:cover; border-radius:4px; background:#000; }
.item .info { min-width:0; }
.item .name { font-size:12px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .album { font-size:11px; color:var(--muted); }
.item .inputs { display:grid; grid-template-columns:110px 1fr 1fr; gap:8px; }
.item input[type=text] { width:100%; font-size:12px; padding:6px 8px; }
.feat { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2); cursor:pointer; }
.feat input { width:16px; height:16px; accent-color:var(--accent); }
.empty { color:var(--muted); padding:30px 0; text-align:center; }
@media (max-width:760px){ .item{grid-template-columns:auto 60px 1fr;} .item img{width:60px;height:46px;} .item .inputs{grid-template-columns:1fr;} }
#selBar { border-color:rgba(194,69,46,.55); }
.item input.selbox { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
button.on { background:var(--accent); color:#FFF4F0; border-color:var(--accent); }

/* 图墙模式：瀑布流列，完整显示作品（不裁切） */
.grid-wrap { columns: 168px; column-gap: 8px; }
.tile { position:relative; break-inside: avoid; margin-bottom: 8px; width: 100%; background:var(--panel); border:1px solid var(--border); border-radius:6px; overflow:hidden; cursor:pointer; }
.tile.is-feat { border-color:rgba(194,69,46,.65); }
.tile.is-sel { outline:2px solid var(--accent); }
.tile img { width:100%; height:auto; display:block; background:#000; }
.tile .tname { font-size:11px; color:var(--ink2); padding:6px 8px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tile .tstar { position:absolute; top:6px; left:6px; width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:rgba(12,11,10,.55); color:rgba(239,235,228,.5); cursor:pointer; }
.tile .tstar.on { color:#E4593F; }
.tile .tstar:hover { color:#FFF4F0; }
.tile .tsel { position:absolute; top:8px; right:8px; width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }

/* 编辑弹窗 */
#modal { position:fixed; inset:0; z-index:50; background:rgba(7,6,5,.88); display:grid; place-items:center; }
#modal[hidden] { display:none; }
.mbox { width:min(680px, 94vw); max-height:92vh; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
.mbox img { width:100%; max-height:380px; object-fit:contain; background:#000; border-radius:6px; margin-bottom:12px; }
.mbox .mname { font-size:12px; color:var(--muted); margin-bottom:12px; overflow-wrap:anywhere; }
.mbox label.f { display:block; margin-bottom:10px; }
.mbox input[type=text] { width:100%; }
.mrow { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
button.danger { background:none; border:1px solid var(--accent); color:var(--accent); }
button.danger:hover { background:var(--accent); color:#FFF4F0; }
</style>
</head>
<body>
<h1>阿缘摄影 · 后台管理<small>仅本机使用，勿部署到线上</small></h1>
<p class="sub">改精选 / 写简介 / 加外链 → 「保存到 GitHub」→ 网站每次打开自动拉取最新配置，约 1 分钟内生效。</p>

<div class="panel">
  <h2>GITHUB 仓库设置</h2>
  <div class="row">
    <label class="f">访问令牌 PAT<input type="password" id="pat" placeholder="ghp_…（仅存本机浏览器）"></label>
    <label class="f">仓库主<input type="text" id="owner" value="ly1063691106"></label>
    <label class="f">仓库名<input type="text" id="repo" value="A-YUAN"></label>
    <label class="f">分支<input type="text" id="branch" value="main"></label>
    <label class="f">配置文件路径<input type="text" id="path" value="data/overrides.json"></label>
    <button class="ghost" id="saveCfg">保存设置</button>
  </div>
  <div class="row">
    <button id="saveLocal">保存到本地（立即生效）</button>
    <button class="ghost" id="saveBtn">保存到 GitHub（发布用）</button>
    <button class="ghost" id="exportBtn">导出本地副本</button>
    <span id="status"></span>
  </div>
</div>

<div class="panel">
  <h2>作品管理 <span class="meta" id="count"></span></h2>
  <div class="toolbar">
    <button class="ghost on" id="vList">列表</button>
    <button class="ghost" id="vGrid">图墙</button>
    <button class="ghost" id="syncBtn">检查新素材</button>
    <select id="albumSel" title="按 photos 下的文件夹筛选"><option value="">全部相册</option></select>
    <input type="text" id="q" placeholder="搜索文件名">
    <label class="feat"><input type="checkbox" id="onlyFeat">只看精选</label>
    <span class="meta" id="loadInfo">先点「加载作品」</span>
  </div>
  <div class="panel" id="selBar" hidden>
    <h2>批量操作 —— 作用于勾选的 <span id="selCount">0</span> 项（配合搜索可整相册操作）</h2>
    <div class="row">
      <button id="bFeat">设为精选</button>
      <button class="ghost" id="bUnfeat">取消精选</button>
      <button class="ghost" id="bClear">清空简介和链接</button>
      <input type="text" id="bLink" placeholder="批量填同一个外链 https://…">
      <button class="ghost" id="bLinkBtn">给选中项填链接</button>
      <button class="ghost" id="bSelAll">全选当前列表</button>
      <button class="ghost" id="bSelNone">取消选择</button>
      <button class="danger" id="bDel">删除选中（移入回收站）</button>
    </div>
  </div>
  <div id="list"><p class="empty">正在载入本机作品列表…</p></div>
</div>

<div id="modal" hidden>
  <div class="mbox">
    <img id="mImg" alt="">
    <div class="mname" id="mName"></div>
    <label class="f">文字简介<input type="text" id="mText" placeholder="这张作品的简介"></label>
    <label class="f">外部链接<input type="text" id="mLink" placeholder="https://…"></label>
    <div class="mrow">
      <button id="mSave">保存修改</button>
      <button class="danger" id="mDel">删除（移入回收站）</button>
      <button class="ghost" id="mClose">关闭</button>
    </div>
  </div>
</div>

<script src="data/photos.js"></script>
<script src="data/content.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var works = [];                       // {name, album, t, featured, text, link}
  var sel = {};                         // 批量选择：name -> true
  var dirty = false;                    // 有未保存的修改
  var CFG_KEY = 'ay_admin_cfg';
  function markDirty() { dirty = true; }
  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = '有未保存的修改，确定离开？'; }
  });

  function cfg() {
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) {}
    return {
      pat: $('pat').value.trim() || saved.pat || '',
      owner: $('owner').value.trim() || saved.owner || 'ly1063691106',
      repo: $('repo').value.trim() || saved.repo || 'A-YUAN',
      branch: $('branch').value.trim() || saved.branch || 'main',
      path: $('path').value.trim() || saved.path || 'data/overrides.json'
    };
  }
  function saveCfg() {
    localStorage.setItem(CFG_KEY, JSON.stringify({
      pat: $('pat').value.trim(), owner: $('owner').value.trim(),
      repo: $('repo').value.trim(), branch: $('branch').value.trim(),
      path: $('path').value.trim()
    }));
  }
  function fillCfg() {
    try {
      var s = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
      if (s.pat) $('pat').value = s.pat;
      if (s.owner) $('owner').value = s.owner;
      if (s.repo) $('repo').value = s.repo;
      if (s.branch) $('branch').value = s.branch;
      if (s.path) $('path').value = s.path;
    } catch (e) {}
  }
  function setStatus(msg, cls) { $('status').textContent = msg; $('status').className = cls || ''; }
  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }

  /* ---------- 加载作品（双击打开也能用：直接读本机 photos.js） ---------- */
  function loadWorks() {
    var D = window.AY_PHOTOS;
    if (D && D.photos && D.photos.length) {
      var caps = (window.AY_CONTENT && window.AY_CONTENT.captions) || {};
      works = D.photos.map(function (p) {
        var name = p.src.split('/').pop();
        var c = caps[name] || {};
        return { name: name, album: p.albumLabel || p.album, src: p.src, t: p.t,
                 featured: !!p.featured, text: p.caption || c.text || '', link: c.link || '' };
      });
      fillAlbums();
      render();
      setStatus('作品 ' + works.length + ' 个。改完记得点「保存到本地」。', 'ok');
      $('loadInfo').textContent = '共 ' + works.length + ' 个作品';
      applyLocalOverrides();               // 叠加本机已保存的精选/简介，关掉再开也不丢
      // 打开即检查 photos/ 的新文件夹/新照片；8 秒内刚同步过就跳过，避免刷新循环
      if (Date.now() - (+sessionStorage.getItem('ay_sync_at') || 0) > 8000) syncNew();
      return;
    }
    // 兜底：photos.js 没读到就走 fetch（需要本地服务）
    setStatus('正在加载作品列表…');
    fetch('data/photos.json').then(function (r) { return r.json(); }).then(function (d) {
      works = d.photos.map(function (p) {
        return { name: p.src.split('/').pop(), album: p.albumLabel || p.album, src: p.src,
                 t: p.t, featured: !!p.featured,
                 text: (p.caption || ''), link: '' };
      });
      fillAlbums();
      render();
      setStatus('作品 ' + works.length + ' 个，开始编辑。已同步的精选/简介以线上配置为准，保存前建议先「拉取线上配置」。', 'ok');
      $('loadInfo').textContent = '共 ' + works.length + ' 个作品';
    }).catch(function () {
      setStatus('加载失败：请确认在网站文件夹里打开本页（photos.js 缺失，先跑一次 build.bat）', 'err');
    });
  }

  /* ---------- 渲染：列表 / 图墙 双模式 ---------- */
  var viewMode = localStorage.getItem('ay_admin_view') || 'list';
  var starSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.86 5.8 6.4.93-4.63 4.51 1.09 6.37L12 17.2l-5.72 3.01 1.09-6.37-4.63-4.51 6.4-.93z"/></svg>';

  function setView(m) {
    viewMode = m;
    localStorage.setItem('ay_admin_view', m);
    $('vList').classList.toggle('on', m === 'list');
    $('vGrid').classList.toggle('on', m === 'grid');
    render();
  }
  function render() {
    if (viewMode === 'grid') renderGrid(); else renderList();
  }

  /* 相册下拉：列出 photos/ 下的全部文件夹（多级相册显示为「甲 · 乙」） */
  function fillAlbums() {
    var sel = $('albumSel');
    var cur = sel.value;
    var names = [];
    works.forEach(function (w) {
      if (w.album && names.indexOf(w.album) < 0) names.push(w.album);
    });
    names.sort(function (a, b) { return a.localeCompare(b, 'zh'); });
    sel.textContent = '';
    var all = document.createElement('option');
    all.value = ''; all.textContent = '全部相册（' + works.length + '）';
    sel.appendChild(all);
    names.forEach(function (n) {
      var o = document.createElement('option');
      o.value = n;
      var cnt = works.filter(function (w) { return w.album === n; }).length;
      o.textContent = n + '（' + cnt + '）';
      sel.appendChild(o);
    });
    if (names.indexOf(cur) >= 0) sel.value = cur;
  }

  /* 统一的筛选条件：相册下拉 + 关键词 + 只看精选 */
  function currentFilter() {
    return {
      album: $('albumSel').value,
      q: $('q').value.trim().toLowerCase(),
      only: $('onlyFeat').checked
    };
  }
  function matchW(w, f) {
    if (f.album && w.album !== f.album) return false;
    if (f.only && !w.featured) return false;
    if (f.q && (w.name + ' ' + w.album).toLowerCase().indexOf(f.q) < 0) return false;
    return true;
  }

  function renderList() {
    var f = currentFilter();
    var box = $('list');
    var frag = document.createDocumentFragment();
    var n = 0;
    works.forEach(function (w, i) {
      if (!matchW(w, f)) return;
      n++;
      var div = document.createElement('div');
      div.className = 'item' + (w.featured ? ' is-feat' : '');

      var sc = document.createElement('input');
      sc.type = 'checkbox'; sc.className = 'selbox'; sc.title = '选中以便批量操作';
      sc.checked = !!sel[w.name];
      sc.addEventListener('change', function () {
        if (sc.checked) sel[w.name] = true; else delete sel[w.name];
        updateSelBar();
      });
      div.appendChild(sc);

      var thumb = document.createElement('img');
      thumb.src = w.t; thumb.loading = 'lazy'; thumb.alt = '';
      div.appendChild(thumb);

      var info = document.createElement('div'); info.className = 'info';
      var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = w.name;
      var al = document.createElement('div'); al.className = 'album'; al.textContent = w.album;
      info.appendChild(nm); info.appendChild(al);
      var inputs = document.createElement('div'); inputs.className = 'inputs';
      var tin = document.createElement('input'); tin.type = 'text';
      tin.placeholder = '文字简介'; tin.value = w.text || '';
      tin.addEventListener('input', function () { w.text = tin.value; markDirty(); });
      var lin = document.createElement('input'); lin.type = 'text';
      lin.placeholder = '外部链接 https://…'; lin.value = w.link || '';
      lin.addEventListener('input', function () { w.link = lin.value; markDirty(); });
      inputs.appendChild(tin); inputs.appendChild(lin);
      info.appendChild(inputs);
      div.appendChild(info);

      var fl = document.createElement('label'); fl.className = 'feat';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = w.featured;
      cb.addEventListener('change', function () { w.featured = cb.checked; div.classList.toggle('is-feat', cb.checked); updateCount(); markDirty(); });
      fl.appendChild(cb); fl.appendChild(document.createTextNode('精选'));
      var ops = document.createElement('div');
      ops.style.cssText = 'display:flex;flex-direction:column;gap:8px;align-items:center;';
      ops.appendChild(fl);
      var del = document.createElement('button');
      del.className = 'ghost danger'; del.textContent = '删除';
      del.style.padding = '4px 10px'; del.style.fontSize = '11px';
      del.addEventListener('click', function () { deleteOne(w); });
      ops.appendChild(del);
      div.appendChild(ops);

      frag.appendChild(div);
    });
    box.textContent = '';
    if (!n) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = '没有匹配的作品'; box.appendChild(p); }
    else box.appendChild(frag);
    updateCount();
  }

  /* ---------- 图墙模式 ---------- */
  function renderGrid() {
    var f = currentFilter();
    var box = $('list');
    var wrap = document.createElement('div');
    wrap.className = 'grid-wrap';
    var n = 0;
    works.forEach(function (w) {
      if (!matchW(w, f)) return;
      n++;
      var tile = document.createElement('div');
      tile.className = 'tile' + (w.featured ? ' is-feat' : '') + (sel[w.name] ? ' is-sel' : '');

      var img = document.createElement('img');
      img.src = w.t; img.loading = 'lazy'; img.alt = '';
      tile.appendChild(img);

      var star = document.createElement('span');
      star.className = 'tstar' + (w.featured ? ' on' : '');
      star.title = w.featured ? '点击取消精选' : '点击设为精选';
      star.innerHTML = starSvg;
      star.addEventListener('click', function (e) {
        e.stopPropagation();
        w.featured = !w.featured;
        markDirty();
        render();
      });
      tile.appendChild(star);

      var sc = document.createElement('input');
      sc.type = 'checkbox'; sc.className = 'tsel'; sc.title = '选中以便批量操作';
      sc.checked = !!sel[w.name];
      sc.addEventListener('click', function (e) { e.stopPropagation(); });
      sc.addEventListener('change', function () {
        if (sc.checked) sel[w.name] = true; else delete sel[w.name];
        updateSelBar(); tile.classList.toggle('is-sel', sc.checked);
      });
      tile.appendChild(sc);

      var nm = document.createElement('div');
      nm.className = 'tname'; nm.textContent = w.name; nm.title = w.name;
      tile.appendChild(nm);

      tile.addEventListener('click', function () { openEditor(w); });
      wrap.appendChild(tile);
    });
    box.textContent = '';
    if (!n) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = '没有匹配的作品'; box.appendChild(p); }
    else box.appendChild(wrap);
    updateCount();
  }

  /* ---------- 编辑弹窗 ---------- */
  function openEditor(w) {
    var m = document.getElementById('modal');
    $('mImg').src = w.t;
    $('mName').textContent = w.album + ' / ' + w.name;
    $('mText').value = w.text || '';
    $('mLink').value = w.link || '';
    $('mSave').onclick = function () {
      w.text = $('mText').value; w.link = $('mLink').value;
      m.hidden = true; render(); markDirty();
      setStatus('已修改「' + w.name + '」，点「保存到本地」写入。', 'ok');
    };
    $('mDel').onclick = function () { deleteOne(w); m.hidden = true; };
    $('mClose').onclick = function () { m.hidden = true; };
    m.hidden = false;
  }

  /* ---------- 删除（移入回收站，需本地服务） ---------- */
  function apiDelete(paths) {
    return fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: paths })
    }).then(function (r) { return r.json(); });
  }
  function removeFromUi(names) {
    works = works.filter(function (w) { return names.indexOf(w.name) < 0; });
    names.forEach(function (n) { delete sel[n]; });
    render(); updateSelBar();
  }
  function deleteOne(w) {
    if (!w.src) { setStatus('该条目没有文件路径信息，无法删除', 'err'); return; }
    if (!confirm('把「' + w.name + '」移入回收站？\n（文件移到 photos\\_回收站\\，可找回；线上需要推送后才消失）')) return;
    apiDelete([w.src]).then(function (res) {
      if (res.errors && res.errors.length) { setStatus('删除失败：' + res.errors[0], 'err'); return; }
      removeFromUi([w.name]);
      setStatus('已移入回收站：' + w.name + '（本地数据已同步）', 'ok');
    }).catch(function () {
      setStatus('删除需要本地服务：请用 start.bat 打开后台（http://127.0.0.1:8787/admin.html）', 'err');
    });
  }
  function updateCount() {
    var f = works.filter(function (w) { return w.featured; }).length;
    $('count').textContent = '—— 精选 ' + f + ' / ' + works.length + '（建议 12~20）';
  }

  /* ---------- 批量操作 ---------- */
  function selectedWorks() {
    return works.filter(function (w) { return sel[w.name]; });
  }
  function updateSelBar() {
    var n = selectedWorks().length;
    $('selBar').hidden = n === 0;
    $('selCount').textContent = n;
  }
  function clearSel() { sel = {}; updateSelBar(); render(); }
  function batch(fn) {
    var list = selectedWorks();
    if (!list.length) { setStatus('请先勾选要批量操作的作品', 'err'); return; }
    list.forEach(fn);
    markDirty();
    render();
    setStatus('已批量修改 ' + list.length + ' 项，点「保存到本地」写入', 'ok');
  }
  $('bFeat').addEventListener('click', function () { batch(function (w) { w.featured = true; }); });
  $('bUnfeat').addEventListener('click', function () { batch(function (w) { w.featured = false; }); });
  $('bClear').addEventListener('click', function () { batch(function (w) { w.text = ''; w.link = ''; }); });
  $('bLinkBtn').addEventListener('click', function () {
    var v = $('bLink').value.trim();
    if (!v) { setStatus('请先在输入框里填好要批量填的外链', 'err'); return; }
    batch(function (w) { w.link = v; });
  });
  $('bSelAll').addEventListener('click', function () {
    var f = currentFilter();
    works.forEach(function (w) { if (matchW(w, f)) sel[w.name] = true; });
    updateSelBar(); render();
  });
  $('bSelNone').addEventListener('click', clearSel);
  $('bDel').addEventListener('click', function () {
    var list = selectedWorks();
    if (!list.length) { setStatus('请先勾选要删除的作品', 'err'); return; }
    if (!list[0].src) { setStatus('列表缺少文件路径，请重新打开本页', 'err'); return; }
    if (!confirm('把选中的 ' + list.length + ' 个作品移入回收站？\n（文件移到 photos\\_回收站\\，可找回；线上需推送后才消失）')) return;
    $('bDel').disabled = true;
    setStatus('正在删除…');
    apiDelete(list.map(function (w) { return w.src; })).then(function (res) {
      if (res.errors && res.errors.length) setStatus('部分失败：' + res.errors[0], 'err');
      else setStatus('已移入回收站 ' + res.deleted.length + ' 个作品（本地数据已同步）', 'ok');
      removeFromUi(res.deleted.map(function (r) { return r.split('/').pop(); }));
    }).catch(function () {
      setStatus('删除需要本地服务：请用 start.bat 打开后台（http://127.0.0.1:8787/admin.html）', 'err');
    }).then(function () { $('bDel').disabled = false; });
  });
  $('vList').addEventListener('click', function () { setView('list'); });
  $('vGrid').addEventListener('click', function () { setView('grid'); });
  if (viewMode === 'grid') { $('vGrid').classList.add('on'); $('vList').classList.remove('on'); }

  /* ---------- 线上配置拉取 ---------- */
  function pullRemote() {
    var c = cfg();
    if (!c.pat) { setStatus('请先填访问令牌 PAT', 'err'); return Promise.reject(); }
    var url = 'https://api.github.com/repos/' + c.owner + '/' + c.repo + '/contents/' + c.path + '?ref=' + c.branch;
    setStatus('正在拉取线上配置…');
    return fetch(url, { headers: { 'Authorization': 'Bearer ' + c.pat, 'Accept': 'application/vnd.github+json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        var o = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
        var byName = {}; works.forEach(function (w) { byName[w.name] = w; w.featured = false; w.text = ''; w.link = ''; });
        (o.featured || []).forEach(function (n) { if (byName[n]) byName[n].featured = true; });
        Object.keys(o.captions || {}).forEach(function (n) {
          if (byName[n]) { byName[n].text = o.captions[n].text || ''; byName[n].link = o.captions[n].link || ''; }
        });
        render();
        setStatus('已载入线上配置（' + (o.updated || '') + '）', 'ok');
        return j;
      });
  }

  /* ---------- 增量同步：photos/ 里新加的文件夹/照片自动收录 ---------- */
  function syncNew() {
    if (location.protocol === 'file:') {
      setStatus('检查新素材需要本地服务：请用 start.bat 打开本页', 'err');
      return;
    }
    setStatus('正在检查 photos/ 里的新素材…');
    $('syncBtn').disabled = true;
    fetch('api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error);
      if (j.added || j.removed) {
        var last = +(sessionStorage.getItem('ay_sync_at') || 0);
        sessionStorage.setItem('ay_sync_at', String(Date.now()));
        if (Date.now() - last < 8000) {                 // 刚因同步刷新过，防循环
          setStatus('素材更新已完成：新增 ' + j.added + '、移除 ' + j.removed + '，请手动刷新页面（F5）', 'ok');
          return;
        }
        setStatus('发现新素材：新增 ' + j.added + ' 个、移除 ' + j.removed + ' 个，正在刷新…', 'ok');
        setTimeout(function () { location.reload(); }, 600);
        return;
      }
      setStatus('素材已是最新：' + j.total + ' 个作品 / ' + j.albums + ' 个相册', 'ok');
      $('loadInfo').textContent = '共 ' + j.total + ' 个作品';
    }).catch(function (e) {
      setStatus('检查新素材失败：' + e.message, 'err');
    }).then(function () { $('syncBtn').disabled = false; });
  }

  /* ---------- 本地保存（写 data/overrides.json + 同步 photos.js） ---------- */
  function applyLocalOverrides() {
    if (location.protocol === 'file:') return;      // file:// 无法读接口，靠 photos.js 里的标记
    fetch('api/overrides').then(function (r) { return r.json(); }).then(function (o) {
      if (!o) return;
      var byName = {};
      works.forEach(function (w) { byName[w.name] = w; });
      if (o.featured && o.featured.length) {
        works.forEach(function (w) { w.featured = false; });
        o.featured.forEach(function (n) { if (byName[n]) byName[n].featured = true; });
      }
      var caps = o.captions || {};
      Object.keys(caps).forEach(function (n) {
        if (byName[n]) { byName[n].text = caps[n].text || ''; byName[n].link = caps[n].link || ''; }
      });
      render();
    }).catch(function () {});
  }
  function saveLocal() {
    if (location.protocol === 'file:') {
      setStatus('本地保存需要本地服务：请用 start.bat 打开本页（http://127.0.0.1:8787/admin.html）', 'err');
      return;
    }
    $('saveLocal').disabled = true;
    setStatus('正在写入本地…');
    fetch('api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildOverrides())
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error);
      dirty = false;
      setStatus('✓ 已保存到本地：精选 ' + j.featured + ' 张、简介 ' + j.captions + ' 条。刷新网站即可看到。', 'ok');
    }).catch(function (e) {
      setStatus('本地保存失败：' + e.message + '（需通过 start.bat 打开）', 'err');
    }).then(function () { $('saveLocal').disabled = false; });
  }

  /* ---------- 组装配置 ---------- */
  function buildOverrides() {
    var caps = {};
    works.forEach(function (w) {
      if (w.text || w.link) caps[w.name] = { text: w.text || '', link: w.link || '' };
    });
    return {
      updated: new Date().toISOString().slice(0, 16).replace('T', ' '),
      featured: works.filter(function (w) { return w.featured; }).map(function (w) { return w.name; }),
      captions: caps
    };
  }

  /* ---------- 保存到 GitHub（发布用，可选） ---------- */
  function saveGitHub() {
    var c = cfg();
    if (!c.pat) { setStatus('请先填访问令牌 PAT', 'err'); return; }
    if (!works.length) { setStatus('请先加载作品', 'err'); return; }
    var base = 'https://api.github.com/repos/' + c.owner + '/' + c.repo + '/contents/' + c.path;
    var headers = { 'Authorization': 'Bearer ' + c.pat, 'Accept': 'application/vnd.github+json' };
    $('saveBtn').disabled = true;
    setStatus('读取线上状态…');
    fetch(base + '?ref=' + c.branch, { headers: headers })
      .then(function (r) { return r.status === 404 ? null : r.json(); })
      .then(function (j) {
        var body = {
          message: '后台管理：更新精选/简介 ' + new Date().toISOString().slice(0, 16),
          content: b64(JSON.stringify(buildOverrides(), null, 2)),
          branch: c.branch
        };
        if (j && j.sha) body.sha = j.sha;
        setStatus('提交到 GitHub…');
        return fetch(base, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
      })
      .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 120)); }); return r.json(); })
      .then(function () {
        setStatus('已提交 GitHub，正在刷新 CDN 缓存…', 'ok');
        return fetch('https://purge.jsdelivr.net/gh/' + c.owner + '/' + c.repo + '@' + c.branch + '/' + c.path).catch(function () {});
      })
      .then(function () {
        setStatus('✓ 已保存并刷新。网站 1 分钟内生效（首次使用需先把仓库推送到 GitHub）', 'ok');
      })
      .catch(function (e) { setStatus('保存失败：' + e.message, 'err'); })
      .then(function () { $('saveBtn').disabled = false; });
  }
  function exportLocal() {
    var blob = new Blob([JSON.stringify(buildOverrides(), null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'overrides.json'; a.click();
    URL.revokeObjectURL(a.href);
  }

  /* ---------- 绑定 ---------- */
  fillCfg();
  $('saveCfg').addEventListener('click', function () { saveCfg(); setStatus('设置已保存到本机浏览器', 'ok'); });
  $('q').addEventListener('input', render);
  $('albumSel').addEventListener('change', render);
  $('syncBtn').addEventListener('click', syncNew);
  $('onlyFeat').addEventListener('change', render);
  $('saveBtn').addEventListener('click', saveGitHub);
  $('saveLocal').addEventListener('click', saveLocal);
  $('exportBtn').addEventListener('click', exportLocal);
  var loadBtn = document.createElement('button');
  loadBtn.textContent = '重新加载列表';
  loadBtn.className = 'ghost';
  loadBtn.addEventListener('click', loadWorks);
  document.querySelector('.toolbar').prepend(loadBtn);
  var pullBtn = document.createElement('button');
  pullBtn.textContent = '拉取线上配置';
  pullBtn.className = 'ghost';
  pullBtn.addEventListener('click', function () { pullRemote().then(render).catch(function () {}); });
  document.querySelector('.toolbar').prepend(pullBtn);
  loadWorks();                             // 打开即自动载入本机作品列表
})();
</script>
</body>
</html>
